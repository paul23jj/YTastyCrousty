services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ytasty
      POSTGRES_PASSWORD: ytasty
      POSTGRES_DB: ytasty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytasty -d ytasty"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql+psycopg://ytasty:ytasty@db:5432/ytasty
    ports:
      - "8000:8000"
    volumes:
      - ./src:/code/src
    command: uvicorn ytastycrousty.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
