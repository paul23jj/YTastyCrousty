[project]
name = "ytastycrousty"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harold", email = "harold.francois@ynov.com" }
]
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.52.4",
]

[project.scripts]
ytastycrousty = "ytastycrousty:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
